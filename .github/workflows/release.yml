name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: build
        run: |
          set -e
          (cd web && npm run build)
          rm -rf server/web/dist && mkdir -p server/web/dist && cp -R web/dist/. server/web/dist/ && touch server/web/dist/.keep
          mkdir -p out
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=; [ "$os" = windows ] && ext=.exe
            (cd server && CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -tags timetzdata \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "../out/hometwin-${os}-${arch}${ext}" ./cmd/hometwin)
          done
          (cd out && sha256sum * > SHA256SUMS)
      - run: gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
